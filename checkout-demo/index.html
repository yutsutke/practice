<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>お支払い（デモ）</title>
<style>
  :root { --bg: #f6f4ef; --fg: #1f2328; --muted: #5d636b; --line: #d8d3c8; --card: #ffffff; --accent: #2f5d50; --accent-fg: #ffffff; --warn-bg: #fff6d6; --warn-fg: #6a5200; --ok: #2f7d4f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161a; --fg: #e8eaed; --muted: #a2a8b0; --line: #343a42; --card: #1d2026; --accent: #6fb39f; --accent-fg: #0f1512; --warn-bg: #3a3012; --warn-fg: #ffd98a; --ok: #7fd3a1; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.7 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  .demo { background: var(--warn-bg); color: var(--warn-fg); border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 16px; }
  .shop { font-size: 13px; color: var(--muted); }
  h1 { font-size: 22px; margin: 2px 0 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .id { font-size: 13px; color: var(--muted); }
  .line { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .line:last-child { border-bottom: 0; }
  .line .room { font-weight: 600; }
  .line .desc { font-size: 13px; color: var(--muted); }
  .line .amt { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .total { display: flex; justify-content: space-between; font-weight: 700; font-size: 18px; margin-top: 6px; }
  h2 { font-size: 16px; margin: 0 0 8px; }
  ol { margin: 0; padding-left: 20px; }
  ol li { margin: 4px 0; }
  ol li.now { font-weight: 700; }
  ol li.done { color: var(--ok); }
  .small { font-size: 13px; color: var(--muted); }
  button { width: 100%; font: inherit; font-weight: 700; padding: 12px 16px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-fg); cursor: pointer; }
  button[disabled] { opacity: .6; cursor: default; }
  .result { margin-top: 12px; font-weight: 600; color: var(--ok); }
  .err { color: var(--warn-fg); background: var(--warn-bg); border-radius: 10px; padding: 12px; }
</style>
</head>
<body>
<main id="main">
  <div class="demo">これはデモの決済ページです（架空のお店）。カード情報は入力せず、お金も動きません。本番では、ここがお店の決済ページ（例：Stripe）になります。</div>
  <div id="root"></div>
</main>
<script>
  // 注文の内訳は URL の d=（base64url の JSON）で受け取る。名前・メールは入っていない。
  // ⚠ 値はすべて textContent で入れる（innerHTML を使わない）。
  const root = document.getElementById("root");
  const yen = (n) => "¥" + Number(n).toLocaleString("ja-JP");
  function el(tag, cls, ...kids) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    for (const k of kids) if (k !== null && k !== undefined) e.append(k);
    return e;
  }
  function decode(s) {
    const bin = atob(s.replace(/-/g, "+").replace(/_/g, "/"));
    return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0))));
  }

  let order = null;
  try {
    const d = new URLSearchParams(location.search).get("d");
    if (d) order = decode(d);
  } catch (e) { order = null; }

  if (!order || !order.id || !Array.isArray(order.lines)) {
    root.append(el("div", "err", "注文の内容を読み取れませんでした。チャットの確認フォームから、もう一度［お店のサイトで支払う］を押してください。"));
  } else {
    const steps = el("ol", null,
      el("li", "now", "カードの枠を仮押さえする（いま・まだ請求されません）"),
      el("li", null, "お店が採寸内容を確かめる（仮押さえはおよそ7日で切れるので、その間に）"),
      el("li", null, "確定したら請求／合わなければ取り消し（請求されません）"),
    );
    const btn = el("button", null, "仮押さえする（デモ）");
    const res = el("div", "result");
    btn.addEventListener("click", () => {
      btn.disabled = true;
      btn.textContent = "仮押さえしました（デモ）";
      steps.children[0].className = "done";
      steps.children[0].textContent = "カードの枠を仮押さえしました（デモ・請求はありません）";
      steps.children[1].className = "now";
      res.textContent = "受付番号 " + order.id + " の仮押さえが済みました。お店が採寸内容を確かめたら、メールでお知らせします。";
    });

    root.append(
      el("div", "shop", order.shop || ""),
      el("h1", null, "お支払い"),
      el("div", "card",
        el("div", "id", "受付番号 " + order.id),
        ...order.lines.map((l) => el("div", "line",
          el("div", null, el("div", "room", l.room || "窓"), el("div", "desc", l.desc || "")),
          el("div", "amt", yen(l.amount || 0)),
        )),
        el("div", "total", el("span", null, "合計"), el("span", null, yen(order.total || 0))),
      ),
      el("div", "card", el("h2", null, "お支払いの流れ（仮押さえ）"), steps,
        el("p", "small", "オーダー品は、お店が採寸内容を確かめてから作ります。そのため、いまは金額の枠だけを押さえ、確定したときに請求します。")),
      btn, res,
    );
  }
</script>
</body>
</html>
